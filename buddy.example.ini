; Buddy on the PC: copy this file to buddy.ini and fill it in.
[buddy]
; Your first name.
owner_name = Eric

; --- Brain (Ollama on this PC) ---
ollama_url = http://localhost:11434
chat_model = qwen3:4b-instruct
; Use the same model and context size as the desk Buddy's "Buddy brain" in
; Home Assistant (Ollama integration, Configure: "Context window size"), so
; they share one loaded copy instead of taking turns on the graphics card.
context_size = 8192
; His personality and instructions (edit freely; {owner} becomes your name).
personality_file = personality.txt

; --- Ears ---
; Speech to text. large-v3-turbo is fast and accurate on an NVIDIA card.
whisper_model = large-v3-turbo
; auto (graphics card if it works, else the processor), cuda or cpu.
; On the processor, small.en is much quicker than large-v3-turbo (about a
; second) and nearly as good for conversation.
whisper_device = auto
language = en
; The wake word: a phrase like "hey buddy" (checked by a tiny Whisper model,
; no training needed; you can also say the question in the same breath:
; "Hey Buddy, what time is it?"), a built-in openWakeWord model (hey_jarvis,
; alexa, hey_mycroft), a trained .onnx file, or off (click his face or press
; the space bar to talk).
wake_word = hey buddy
; For built-in and .onnx models: 0-1, higher = harder to wake by mistake.
wake_threshold = 0.5
; Keep listening for a few seconds after he answers.
follow_up = on
; Which microphone and speakers (part of the name, as Windows shows it),
; or leave empty for Windows' default ones.
microphone =
speaker =

; --- Voice (the Kokoro container Home Assistant already uses) ---
kokoro_host = localhost
kokoro_port = 10210
; The same voice as the desk Buddy, e.g. af_heart or am_michael.
voice = af_heart
; 0-200 %
volume = 100

; --- What he can check ---
; Web search: the SearXNG the desk Buddy uses (empty = no searching).
search_url = http://localhost:8888
; Weather (from Open-Meteo, free, no account): your town, e.g.
; "Columbus, Ohio" (empty = no weather). units = us or metric.
weather_place =
units = us
; Looking through the webcam ("what am I holding?"): the vision model Buddy's
; eyes uses (empty = no looking), and which camera (0 = the first).
vision_model = qwen2.5vl:7b
camera_index = 0

; --- Voice ID (who's talking: you or a guest) ---
; The voice ID service the desk Buddy uses (empty = off).
voice_id_url = http://localhost:8095

; --- Shared with the desk Buddy ---
; Home Assistant's MQTT broker (the Mosquitto add-on) and a login, the same as
; the desk Buddy's and Buddy's eyes'. His memory notes are kept there, so both
; bodies share them even when the other one is off.
mqtt_host =
mqtt_port = 1883
mqtt_user =
mqtt_password =
; Buddy's eyes' diary, so he knows what he saw today, e.g.
; C:\Users\you\Downloads\BuddyEyes\buddy-eyes\diary.json
eyes_diary =

; --- Window ---
window_width = 320
always_on_top = on
