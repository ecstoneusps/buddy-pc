; Buddy on the PC: copy this file to buddy.ini and fill it in.
[buddy]
; Your first name.
owner_name = Eric

; --- Brain (Ollama on this PC) ---
ollama_url = http://localhost:11434
chat_model = qwen3:4b-instruct
; Use the same model and context size as the desk Buddy's "Buddy brain" in
; Home Assistant (Ollama integration, Configure: "Context window size"), so
; they share one loaded copy instead of taking turns on the graphics card.
context_size = 8192
; His personality and instructions (edit freely; {owner} becomes your name).
personality_file = personality.txt
; Things he should never bring up, not even in a joke, comma-separated
; (e.g. coffee, if you don't drink it). Empty = none.
never_mention =

; --- Ears ---
; Speech to text. large-v3-turbo is fast and accurate on an NVIDIA card.
whisper_model = large-v3-turbo
; auto (graphics card if it works, else the processor), cuda or cpu.
; On the processor, small.en is much quicker than large-v3-turbo (about a
; second) and nearly as good for conversation.
whisper_device = auto
language = en
; The wake word: a phrase like "hey buddy" (checked by a tiny Whisper model,
; no training needed; you can also say the question in the same breath:
; "Hey Buddy, what time is it?"), a built-in openWakeWord model (hey_jarvis,
; alexa, hey_mycroft), a trained .onnx file, or off (click his face or press
; the space bar to talk).
wake_word = hey buddy
; For built-in and .onnx models: 0-1, higher = harder to wake by mistake.
wake_threshold = 0.5
; Keep listening for a few seconds after he answers.
follow_up = on
; Follow-ups (without "Hey Buddy") only from your voice, so a video can't keep
; a conversation going (needs voice ID; guests say "Hey Buddy" each time).
follow_up_only_you = on
; Which microphone and speakers (part of the name, as Windows shows it),
; or leave empty for Windows' default ones.
microphone =
speaker =

; --- Voice (the Kokoro container Home Assistant already uses) ---
kokoro_host = localhost
kokoro_port = 10210
; The same voice as the desk Buddy, e.g. af_heart or am_michael.
voice = af_heart
; His volume, 0-300 %. Every sentence is first brought to the same loudness
; (about as loud as a video), then this on top; above 100 a limiter keeps the
; loudest parts from distorting.
volume = 100
; While he talks, other apps (videos, games, music) are turned down to this
; % of their volume, and back up when he's done. 100 = leave them alone.
duck_others = 40
; Programs never to turn down, comma-separated (audio enhancers like FxSound,
; Voicemeeter and Sonar are already left alone: all sound goes through them).
duck_skip =
; A short chime when he starts listening (after "Hey Buddy" or a click).
chime = on
; Pause what's playing (YouTube, Spotify...) while you talk to him, and
; resume it after. Things that can't be paused (games) are turned down instead.
pause_media = on
; He knows which window is in front and what's playing, and can look at the
; screen when you ask ("what's this error?"). Nothing leaves the PC.
pc_awareness = on
; He listens to what the PC itself plays too: if what the microphone heard is
; what the PC just played (a video, a game, a call), it wasn't you.
ignore_pc_audio = on

; --- Your home's devices (through Home Assistant) ---
; Lights, switches, locks, the thermostat... ("turn off the kitchen lights").
; ha_url: Home Assistant's address. ha_token: a long-lived access token (in
; Home Assistant: your profile, Security, Long-lived access tokens, Create).
; Paste it here only: it stays on this PC. Empty = no device control.
ha_url = http://homeassistant.local:8123
ha_token =
; Which Home Assistant assistant handles it (empty = its own, the usual one).
ha_agent =

; --- What he can check ---
; Web search: the SearXNG the desk Buddy uses (empty = no searching).
search_url = http://localhost:8888
; Weather (from Open-Meteo, free, no account): your town, e.g.
; "Columbus, Ohio" (empty = no weather). units = us or metric.
weather_place =
units = us
; Looking through the webcam ("what am I holding?"): the vision model Buddy's
; eyes uses (empty = no looking), and which camera (0 = the first).
vision_model = qwen2.5vl:7b
camera_index = 0
; Only answer "Hey Buddy" (and follow-ups), and only say Buddy's eyes' remarks,
; when the webcam sees you at the
; desk, facing him: not away, not turned around talking to someone. The
; camera light blinks on for a moment each time he checks. Nothing is saved.
; If the camera is busy or the room is dark, he answers anyway.
need_to_see_you = on

; --- Buddy on your phone ---
; A web page with his face, a Talk button and a type box, on this PC only
; (http://localhost:8770). To reach it from your phone anywhere, run once in
; a Command Prompt:  tailscale serve --bg 8770
; then open https://<this PC's Tailscale name>.ts.net on the phone. 0 = off.
web_port = 8770

; --- Voice ID (who's talking: you or a guest) ---
; The voice ID service the desk Buddy uses (empty = off).
voice_id_url = http://localhost:8095

; --- Shared with the desk Buddy ---
; Home Assistant's MQTT broker (the Mosquitto add-on) and a login, the same as
; the desk Buddy's and Buddy's eyes'. His memory notes are kept there, so both
; bodies share them even when the other one is off.
mqtt_host =
mqtt_port = 1883
mqtt_user =
mqtt_password =
; Buddy's eyes' diary, so he knows what he saw today, e.g.
; C:\Users\you\Downloads\BuddyEyes\buddy-eyes\diary.json
eyes_diary =

; --- Window ---
; on, off, or auto (no window while he's on the Trofeo screen; closing the
; window then only hides it, and closing the black console window quits him).
window = auto
window_width = 320
always_on_top = on

; --- Thermalright Trofeo Vision 9.16" screen ---
; on: his face on the screen too, with the time and the CPU/GPU readings
; (close Thermalright's TRCC app first: only one program can use the screen).
; trofeo_orientation: portrait (standing up) or landscape (lying down).
; If he's upside down or sideways, set trofeo_rotate to 0, 90, 180 or 270.
; trofeo_fps: pictures a second (lower if the PC is busy).
trofeo_screen = off
trofeo_orientation = portrait
trofeo_rotate = auto
trofeo_fps = 20
; A program that grabs the screen at startup if it gets there first (SignalRGB
; does, even with the screen disabled in it): turn off its own "start with
; Windows" and put its full path here; he starts it once the screen is his.
; Options can follow the path (SignalRGB gets --silent by itself: tray only).
; e.g. start_after_screen = C:\Users\you\AppData\Local\VortxEngine\SignalRgbLauncher.exe
start_after_screen =
