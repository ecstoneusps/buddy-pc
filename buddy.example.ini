; Buddy on the PC: copy this file to buddy.ini and fill it in.
[buddy]
; Your first name.
owner_name = Eric

; --- Brain (Ollama on this PC) ---
ollama_url = http://localhost:11434
chat_model = qwen3:4b-instruct
; His personality and instructions (edit freely; {owner} becomes your name).
personality_file = personality.txt

; --- Ears ---
; Speech to text. large-v3-turbo is fast and accurate on an NVIDIA card.
whisper_model = large-v3-turbo
; auto (graphics card if it works, else the processor), cuda or cpu
whisper_device = auto
language = en
; The wake word: hey_jarvis for now (a "Hey Buddy" model comes later),
; or off to talk only by clicking his face (or pressing the space bar).
wake_word = hey_jarvis
; 0-1: higher = harder to wake by mistake, lower = wakes more easily.
wake_threshold = 0.5
; Keep listening for a few seconds after he answers.
follow_up = on
; Which microphone and speakers (part of the name, as Windows shows it),
; or leave empty for Windows' default ones.
microphone =
speaker =

; --- Voice (the Kokoro container Home Assistant already uses) ---
kokoro_host = localhost
kokoro_port = 10210
; The same voice as the desk Buddy, e.g. af_heart or am_michael.
voice = af_heart
; 0-200 %
volume = 100

; --- Shared with the desk Buddy ---
; His address (the one his settings page is on), to share his memory notes.
desk_buddy_url =
; Buddy's eyes' diary, so he knows what he saw today, e.g.
; C:\Users\you\Downloads\BuddyEyes\buddy-eyes\diary.json
eyes_diary =

; --- Window ---
window_width = 320
always_on_top = on
